# Database configuration — auto-detects adapter from DATABASE_URL.
#
# PostgreSQL: Set DATABASE_URL=postgres://user:pass@host/dbname
# SQLite:     Leave DATABASE_URL unset (default for local development)
#
# Use bin/configure to strip the adapter you don't need.

<% use_postgres = ENV["DATABASE_URL"]&.start_with?("postgres") %>

<% if use_postgres %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: trailhead_development

test:
  <<: *default
  database: trailhead_test

production:
  primary: &primary_production
    <<: *default
    database: trailhead_production
    username: trailhead
    password: <%= ENV["TRAILHEAD_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: trailhead_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: trailhead_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: trailhead_production_cable
    migrations_paths: db/cable_migrate

<% else %>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3

<% end %>
