# Kamal deployment configuration — Hetzner Cloud ready
# Update IPs, domain, and registry before first deploy.

service: trailhead

image: your-registry/trailhead

servers:
  web:
    hosts:
      - YOUR_HETZNER_IP
    labels:
      traefik.http.routers.trailhead.rule: Host(`app.yoursite.com`)
      traefik.http.routers.trailhead.tls.certresolver: letsencrypt
  worker:
    hosts:
      - YOUR_HETZNER_IP
    cmd: bin/jobs

proxy:
  ssl: true
  host: app.yoursite.com

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_LOG_LEVEL: info
    SOLID_QUEUE_IN_PUMA: false
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - STRIPE_PUBLISHABLE_KEY
    - HONEYBADGER_API_KEY

accessories:
  db:
    image: postgres:17
    host: YOUR_HETZNER_IP
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: trailhead_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: YOUR_HETZNER_IP
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data

healthcheck:
  path: /up
  port: 3000
  max_attempts: 10
  interval: 20s
